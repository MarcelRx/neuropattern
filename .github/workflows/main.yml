# =============================================================================
# NeuroPattern LifeTracker — GitHub Actions CI/CD
# Build, test, and deploy on push to main
# =============================================================================

name: NeuroPattern CI/CD

on:
  push:
    branches: [main, main-clean, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, main-clean]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Code Quality & Unit Tests
  # ---------------------------------------------------------------------------
  test-unit:
    name: Lint & Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Python setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # Python linting
      - name: Lint Python with Ruff
        run: ruff check backend/

      # Python unit tests (skip integration tests)
      - name: Run Python unit tests
        run: python -m pytest backend/tests/ -v --tb=short -m "not integration"
        env:
          JWT_SECRET_KEY: "test-jwt-secret-key-do-not-use-in-production"
          SECRET_KEY: "test-secret-key-do-not-use-in-production"
          PYTHONPATH: ${{ github.workspace }}/backend

      # Node.js + pnpm setup
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install

      # TypeScript check
      - name: Type check
        run: pnpm run lint

      # Frontend build test
      - name: Build frontend
        run: pnpm run build

  # ---------------------------------------------------------------------------
  # JOB 2: MongoDB Integration Tests
  # ---------------------------------------------------------------------------
  test-integration:
    name: MongoDB Integration Tests
    runs-on: ubuntu-24.04

    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_DATABASE: neuropattern_test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Python setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      # Python linting
      - name: Lint Python with Ruff
        run: ruff check backend/

      # Python integration tests (only run integration tests)
      - name: Run Python integration tests
        run: python -m pytest backend/tests/ -v --tb=short -m "integration"
        env:
          JWT_SECRET_KEY: "test-jwt-secret-key-do-not-use-in-production"
          SECRET_KEY: "test-secret-key-do-not-use-in-production"
          PYTHONPATH: ${{ github.workspace }}/backend
          MONGODB_URI: "mongodb://localhost:27017/neuropattern_test"
          DB_NAME: "neuropattern_test"

  # ---------------------------------------------------------------------------
  # JOB 3: Build & Push Docker Image
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Image
    needs: [test-unit, test-integration]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
